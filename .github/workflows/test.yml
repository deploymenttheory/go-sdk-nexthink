name: Go tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
      - run: go test -race ./... -timeout 180s
      - run: go vet ./...
      - name: Build underscore-directory examples
        run: |
          go build -o /tmp/basic-client ./examples/nexthink/_build_client/new_client
          go build -o /tmp/logged-client ./examples/nexthink/_build_client/new_client_with_logger
